services:
  - type: web
    name: idcard
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /cracha/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: BASE_PATH
        value: /cracha
